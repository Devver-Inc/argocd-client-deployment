organization:
  name: vr
  domain: devver.app
project:
  name: test0
imagePullSecrets:
  - name: ghcr-secret
container:
  image: ghcr.io/devver-inc/deploy-agent:latest
  port: 80
  type: app
  command: []
  args: []
  env:
    DEVVER_SECRET: dev-secret-123
    DEVVER_PROJECT_ID: 6ac619a5a95f30cec123da01
    DEVVER_GIT_AUTH_URL: https://app.devver.app/api/v1
    DEVVER_WIDGET_URL: >-
      https://cdn.jsdelivr.net/gh/Devver-Inc/overlay@dev/public/devver-overlay.iife.js
resources:
  requests:
    memory: 1024Mi
    cpu: 1000m
  limits:
    memory: 2Gi
    cpu: 2000m
persistence:
  enabled: true
  app:
    size: 5Gi
    mountPath: /app
    storageClass: nfs-devver-prod
  root:
    size: 5Gi
    mountPath: /root
    storageClass: nfs-devver-prod
replicaCount: 1
ports:
  http: 80
  https: 443
labels: {}
annotations: {}
